<body>
<title>Mis Gastos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b1610">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: app de banco de una columna; saldo del mes arriba, acciones redondas, tarjetas y barra de pestañas fija abajo.
   Un solo tema oscuro a propósito (verde bosque + lima). */
:root {
  color-scheme: dark;
  --bg: #0b1610; --surface: #13231a; --surface-2: #1c3125; --line: #284232;
  --ink: #f1f7ec; --ink-2: #b7c9b5; --muted: #7d947f;
  --lima: #a3ec74; --lima-ink: #10290a; --lima-soft: #2a4a22;
  --good: #a3ec74; --warn: #f4c862; --bad: #ff8a78;
  --good-bg: #213f1c; --warn-bg: #3d3115; --bad-bg: #44201b;
  --f-display: "Manrope", "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 22px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 18px; }
h3 { font-size: 15px; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lima); outline-offset: 2px; }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: 13px; }

/* Encabezado */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 4px 18px; }
.marca { display: flex; align-items: center; gap: 10px; }
.marca .logo { width: 36px; height: 36px; border-radius: 12px; background: var(--lima); display: grid; place-items: center; }
.marca h1 { font-size: 19px; }
.chip-estado { cursor: pointer; font-size: 12px; color: var(--ink-2); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-weight: 600; }
.vista { display: grid; gap: 14px; }
.titulo-vista { font-size: 28px; padding-block: 2px 4px; }
.banner { background: var(--lima-soft); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 13px; }

/* Saldo del mes */
.hero { padding: 6px 2px 10px; display: grid; gap: 10px; }
.hero-monto { font-family: var(--f-display); font-weight: 800; font-size: clamp(46px, 14vw, 64px); line-height: 1; letter-spacing: -0.035em; display: flex; align-items: baseline; gap: 6px; }
.hero-monto .moneda { font-size: 0.38em; color: var(--ink-2); font-weight: 700; letter-spacing: 0; }
.hero-monto .cent { font-size: 0.42em; color: var(--muted); letter-spacing: -0.01em; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; width: fit-content; }
.pill.bien { background: var(--good-bg); color: var(--good); }
.pill.atento { background: var(--warn-bg); color: var(--warn); }
.pill.riesgo { background: var(--bad-bg); color: var(--bad); }
.pill.neutro { background: var(--surface); color: var(--ink-2); }
.barra-mes { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); margin-top: 4px; }
.barra-mes i { position: absolute; inset: 0 auto 0 0; background: var(--lima); border-radius: 5px; }
.barra-mes b { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); }
.barra-leg { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }

/* Acciones redondas */
.rapidas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-block: 6px 4px; }
.rapida { background: none; border: 0; display: grid; justify-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 0; }
.rapida .circ { width: 54px; height: 54px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--lima); transition: transform .15s; }
.rapida.prim .circ { background: var(--lima); color: var(--lima-ink); }
.rapida:active .circ { transform: scale(0.94); }

/* Tarjetas */
.card { background: var(--surface); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.link { background: none; border: 0; color: var(--lima); font-weight: 700; font-size: 14px; padding: 4px 0; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mini { background: var(--surface); border: 0; border-radius: var(--r); padding: 16px; display: grid; gap: 4px; align-content: start; text-align: left; min-width: 0; }
.mini .v { font-family: var(--f-display); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.gauge { width: 100%; max-width: 150px; height: auto; display: block; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: 21px; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }

/* Gráfico de columnas */
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; height: 160px; padding-top: 20px; }
.col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.col .barra { background: var(--lima); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.col.atenuada .barra { background: var(--lima-soft); box-shadow: inset 0 0 0 1.5px var(--lima); }
.col.pron .barra { background: repeating-linear-gradient(135deg, var(--lima) 0 2px, transparent 2px 7px); box-shadow: inset 0 0 0 1.5px var(--lima); }
.col .val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); white-space: nowrap; font-weight: 700; }
.col-ejes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; padding-top: 6px; }
.col-ejes span { text-align: center; font-size: 11px; color: var(--muted); overflow: hidden; }
.leyenda { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--lima); margin-right: 6px; vertical-align: -1px; }
.leyenda i.curso { background: var(--lima-soft); box-shadow: inset 0 0 0 1.5px var(--lima); }
.leyenda i.pron { background: repeating-linear-gradient(135deg, var(--lima) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1.5px var(--lima); }

/* Rankings */
.rank { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.rank li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.rank .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rank .num { font-weight: 700; }
.rank .pista { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.rank .pista i { display: block; height: 100%; background: var(--lima); border-radius: 3px; }
.rank .det { font-size: 12px; color: var(--muted); }

/* Movimientos */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; }
.filtros input, .filtros select { background: var(--surface); border: 0; border-radius: 99px; padding: 11px 16px; min-width: 0; }
.filtros input { flex: 1 1 170px; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.lista { display: grid; }
.dia { display: grid; }
.dia-cab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; padding: 14px 4px 6px; text-transform: capitalize; }
.mov { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 16px; padding: 10px 6px; }
.mov:hover, .mov:focus-visible { background: var(--surface-2); }
.av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; background: var(--surface-2); color: var(--ink); }
.card .av { background: var(--surface-2); }
.mov .nom { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mov .meta { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mov .m { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.mov .m.entrada { color: var(--lima); }
.mov.excluido { opacity: 0.55; }

/* Crédito */
.puntaje { display: grid; justify-items: center; gap: 8px; text-align: center; }
.puntaje .gauge { max-width: 240px; }
.hallazgos { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.hallazgos li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface-2); }
.hallazgos .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.hallazgos .bien .ic { background: var(--good-bg); color: var(--good); }
.hallazgos .atento .ic { background: var(--warn-bg); color: var(--warn); }
.hallazgos .riesgo .ic { background: var(--bad-bg); color: var(--bad); }
.metricas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* Tablas */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 9px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }

/* Botones, formularios, diálogo */
.btn { border: 0; background: var(--surface-2); border-radius: 99px; padding: 11px 18px; font-weight: 700; }
.btn.prim { background: var(--lima); color: var(--lima-ink); }
.btn.peligro { color: var(--bad); }
.segmento { display: inline-flex; gap: 4px; background: var(--surface); border-radius: 99px; padding: 4px; }
.segmento button { border: 0; background: none; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); border-radius: 99px; }
.segmento button[aria-pressed="true"] { background: var(--lima); color: var(--lima-ink); }
dialog { border: 0; border-radius: 26px; background: var(--surface); color: var(--ink); padding: 22px; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / 0.6); }
.form { display: grid; gap: 14px; }
.campo { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.campo input, .campo select { width: 100%; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 0; border-radius: 14px; padding: 12px 14px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.check input { accent-color: var(--lima); width: 18px; height: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--lima); color: var(--lima-ink); font-weight: 700; padding: 12px 18px; border-radius: 99px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }
#tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 10px; white-space: nowrap; }
.vacio { padding: 28px 12px; text-align: center; color: var(--muted); }

/* Barra de pestañas */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; justify-content: center; padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); background: rgb(11 22 16 / 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabbar-in { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); width: 100%; max-width: 560px; }
.tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); }
.tabbar button[aria-selected="true"] { color: var(--lima); }
.tabbar svg { width: 24px; height: 24px; }
@media (prefers-reduced-motion: no-preference) { .barra, .pista i, .barra-mes i { transition: height .35s, width .35s; } }
/* Animación de apertura: el logo rebota, la flecha se dibuja, el lima llena la pantalla y se revela el tablero */
#splash { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; overflow: hidden; transition: opacity .3s ease .45s, visibility 0s .8s; }
#splash.fuera { opacity: 0; visibility: hidden; }
.sp-logo { width: 96px; height: 96px; border-radius: 30px; background: var(--lima); display: grid; place-items: center; animation: sp-pop .7s cubic-bezier(.34, 1.56, .64, 1) backwards; transition: transform .5s cubic-bezier(.7, 0, .84, 0), border-radius .5s; }
#splash.fuera .sp-logo { transform: scale(14); border-radius: 50%; }
.sp-logo svg { width: 54px; height: 54px; fill: none; stroke: var(--lima-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.sp-l1 { stroke-dasharray: 30; stroke-dashoffset: 30; animation: sp-trazo .5s .35s ease-out forwards; }
.sp-l2 { stroke-dasharray: 12; stroke-dashoffset: 12; animation: sp-trazo .28s .78s ease-out forwards; }
.entra > * { animation: sp-sube .55s cubic-bezier(.2, .8, .2, 1) backwards; }
.entra > :nth-child(2) { animation-delay: .06s; } .entra > :nth-child(3) { animation-delay: .12s; }
.entra > :nth-child(4) { animation-delay: .18s; } .entra > :nth-child(5) { animation-delay: .24s; }
.entra > :nth-child(n+6) { animation-delay: .3s; }
@keyframes sp-pop { from { transform: scale(.3) rotate(-14deg); opacity: 0; } }
@keyframes sp-trazo { to { stroke-dashoffset: 0; } }
@keyframes sp-sube { from { transform: translateY(18px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sp-logo, .sp-l1, .sp-l2, .entra > * { animation: none; }
  .sp-l1, .sp-l2 { stroke-dashoffset: 0; }
  #splash.fuera .sp-logo { transform: none; }
}
/* Mi Mes */
.top-der { display: flex; align-items: center; gap: 8px; }
.btn-ic { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); font-size: 22px; display: grid; place-items: center; flex: none; }
.mes-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mes-nav h2 { font-size: 21px; }
.rm-fila { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rm-dato { display: grid; gap: 2px; background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
.rm-dato .v { font-family: var(--f-display); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.rm-sobra { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: 16px; font-weight: 700; }
.rm-sobra b { font-family: var(--f-display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.rm-sobra.bien { background: var(--good-bg); color: var(--good); }
.rm-sobra.riesgo { background: var(--bad-bg); color: var(--bad); }
.pago { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 34px; gap: 12px; align-items: center; padding: 12px 6px; border-radius: 14px; cursor: pointer; transition: opacity .3s, transform .3s; }
.pago:hover, .pago:focus-visible { background: var(--surface-2); }
.pago .nom { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pago .meta { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pago .m { font-family: var(--f-display); font-weight: 700; }
.pago.saliendo { opacity: 0; transform: translateX(48px); }
.pago.hecho { cursor: default; }
.pago.hecho .nom { color: var(--ink-2); }
.prio { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.prio.urgente { background: var(--bad); }
.prio.importante { background: var(--warn); }
.prio.normal { box-shadow: inset 0 0 0 2px var(--muted); }
.prio.hecho { background: var(--lima); }
.atr { color: var(--bad); font-weight: 700; }
.pronto { color: var(--warn); font-weight: 700; }
.check { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: none; position: relative; padding: 0; transition: background .2s, border-color .2s, transform .2s; }
.check::after { content: ""; position: absolute; left: 10px; top: 5px; width: 8px; height: 15px; border: solid var(--muted); border-width: 0 3px 3px 0; transform: rotate(45deg); opacity: .35; }
.check:hover::after { opacity: 1; }
.check.on { background: var(--lima); border-color: var(--lima); transform: scale(1.08); }
.check.on::after { border-color: var(--lima-ink); opacity: 1; }
.grupo-cab { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 12px 6px 2px; }
.pagados-cab { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 16px; gap: 10px; align-items: center; background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.ok-ic { width: 28px; height: 28px; border-radius: 50%; background: var(--good-bg); color: var(--lima); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.flecha { color: var(--muted); }
.mini-btn { border: 0; background: var(--surface-2); color: var(--lima); font-weight: 700; font-size: 12px; border-radius: 99px; padding: 6px 11px; }
.tocable { cursor: pointer; }
.trofeo { font-weight: 800; color: var(--warn); }
.logros { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.logros li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: center; }
.logros li div { display: grid; min-width: 0; }
.leyenda .prio { margin-right: 4px; vertical-align: 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 99px; background: var(--surface-2); font-size: 14px; color: var(--ink); cursor: pointer; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip:has(input:checked) { box-shadow: inset 0 0 0 2px var(--lima); }
.chip:has(input:focus-visible) { outline: 2px solid var(--lima); outline-offset: 2px; }
.ayuda { font-size: 12px; color: var(--muted); }
.cta { width: 100%; border: 0; text-align: left; color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.flecha-der { font-size: 26px; color: var(--lima); }
.mini-pago { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.mini-pago .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
@media (prefers-reduced-motion: reduce) { .pago, .check { transition: none; } }
</style>

<div class="app">
  <header class="top">

<script id="analisis">
// Análisis puro (sin DOM). Lo prueba test/test.js.
var EXCLUIDAS = ['Pago de tarjeta', 'Transferencias', 'Ingreso'];

function esGasto(m) { return m.monto > 0 && EXCLUIDAS.indexOf(m.categoria) < 0; }
function mesDe(f) { return String(f).slice(0, 7); }
function sumarMes(ym, n) {
  var a = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n;
  a += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return a + '-' + ('0' + (m + 1)).slice(-2);
}
function diasDelMes(ym) { return new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(); }
function suma(xs, f) { return xs.reduce(function (s, x) { return s + (f ? f(x) : x); }, 0); }
function redondear(n) { return Math.round(n * 100) / 100; }
function claveComercio(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s*-?\s*parcela\s*\d+\s*\/\s*\d+/i, '').replace(/[*#].*$/, '').replace(/\s+/g, ' ').trim();
}
function nombreComercio(s) {
  return String(s || '').replace(/\s*-?\s*parcela\s*\d+\s*\/\s*\d+/i, '').replace(/\*/g, ' ').replace(/\s+/g, ' ').trim();
}
function agrupar(xs, clave, nombre) {
  var g = {};
  xs.forEach(function (x) {
    var k = clave(x);
    if (!g[k]) g[k] = { nombre: nombre(x), total: 0, n: 0 };
    g[k].total += x.monto; g[k].n++;
  });
  return Object.keys(g).map(function (k) { g[k].total = redondear(g[k].total); return g[k]; });
}
// Promedio ponderado: el mes más reciente pesa más.
function ponderado(vals) {
  if (!vals.length) return 0;
  var w = 0, s = 0;
  vals.forEach(function (v, i) { s += v * (i + 1); w += i + 1; });
  return s / w;
}
function desvio(vals) {
  if (vals.length < 2) return 0;
  var p = suma(vals) / vals.length;
  return Math.sqrt(suma(vals, function (v) { return (v - p) * (v - p); }) / (vals.length - 1));
}

/** periodo: 'mes' | '3m' | '12m' | 'todo' — afecta los rankings. */
function analizar(movs, cfg, hoy, periodo) {
  cfg = cfg || {};
  periodo = periodo || '3m';
  var gastos = movs.filter(esGasto);
  var mesActual = mesDe(hoy);
  var dia = +String(hoy).slice(8, 10);

  // Gasto por mes, sin huecos
  var primero = gastos.reduce(function (min, m) { return mesDe(m.fecha) < min ? mesDe(m.fecha) : min; }, mesActual);
  var porMes = {};
  for (var ym = primero; ym <= mesActual; ym = sumarMes(ym, 1)) porMes[ym] = { mes: ym, total: 0, credito: 0, n: 0 };
  gastos.forEach(function (m) {
    var x = porMes[mesDe(m.fecha)];
    if (!x) return;
    x.total += m.monto; x.n++;
    if (m.metodo === 'credito') x.credito += m.monto;
  });
  var meses = Object.keys(porMes).sort().map(function (k) {
    porMes[k].total = redondear(porMes[k].total); porMes[k].credito = redondear(porMes[k].credito); return porMes[k];
  });
  var completos = meses.filter(function (m) { return m.mes < mesActual; });
  var conDatos = completos.filter(function (m) { return m.n > 0; });
  var ultimos6 = conDatos.slice(-6);
  var promedio = ultimos6.length ? suma(ultimos6, function (m) { return m.total; }) / ultimos6.length : 0;
  var mesMayor = (conDatos.length ? conDatos : meses).reduce(function (a, b) { return b.total > a.total ? b : a; }, { total: -1 });
  if (mesMayor.total < 0) mesMayor = null;

  // Mes en curso: lo gastado + lo que normalmente gastas en los días que faltan
  var actual = porMes[mesActual];
  var dias = diasDelMes(mesActual);
  var proyeccion = promedio ? actual.total + promedio * (1 - dia / dias) : (dia ? actual.total / dia * dias : actual.total);
  actual = { mes: mesActual, total: actual.total, credito: actual.credito, n: actual.n, dia: dia, dias: dias, proyeccion: redondear(Math.max(proyeccion, actual.total)), promedio: redondear(promedio) };

  // Rango de meses para rankings
  var desde = { mes: mesActual, '3m': sumarMes(mesActual, -2), '12m': sumarMes(mesActual, -11), todo: '0000-00' }[periodo];
  var enPeriodo = gastos.filter(function (m) { return mesDe(m.fecha) >= desde; });
  var totalPeriodo = suma(enPeriodo, function (m) { return m.monto; });

  var topCategorias = agrupar(enPeriodo, function (m) { return m.categoria || 'Otros'; }, function (m) { return m.categoria || 'Otros'; })
    .sort(function (a, b) { return b.total - a.total; });
  topCategorias.forEach(function (c) { c.pct = totalPeriodo ? c.total / totalPeriodo : 0; });
  var comercios = agrupar(enPeriodo, function (m) { return claveComercio(m.comercio); }, function (m) { return nombreComercio(m.comercio); });
  var topComercios = comercios.slice().sort(function (a, b) { return b.total - a.total; }).slice(0, 8);
  var frecuentes = comercios.slice().sort(function (a, b) { return b.n - a.n || b.total - a.total; }).slice(0, 8);

  var porDiaSemana = [0, 0, 0, 0, 0, 0, 0]; // lunes..domingo
  var porHora = []; for (var h = 0; h < 24; h++) porHora.push(0);
  var conHora = 0;
  enPeriodo.forEach(function (m) {
    var d = new Date(m.fecha + 'T12:00:00Z').getUTCDay();
    porDiaSemana[(d + 6) % 7] += m.monto;
    if (m.hora) { porHora[+m.hora.slice(0, 2)] += m.monto; conHora++; }
  });
  var hormiga = enPeriodo.filter(function (m) { return m.monto < 50; });

  // Pronóstico del próximo mes (promedio ponderado de los últimos 3 meses con datos)
  var base = conDatos.slice(-3);
  var totalPron = ponderado(base.map(function (m) { return m.total; }));
  var var6 = desvio(ultimos6.map(function (m) { return m.total; }));
  var mesesBase = {}; base.forEach(function (m) { mesesBase[m.mes] = true; });
  var catMes = {};
  gastos.forEach(function (m) {
    if (!mesesBase[mesDe(m.fecha)]) return;
    var c = m.categoria || 'Otros';
    catMes[c] = catMes[c] || {};
    catMes[c][mesDe(m.fecha)] = (catMes[c][mesDe(m.fecha)] || 0) + m.monto;
  });
  var porCategoria = Object.keys(catMes).map(function (c) {
    return { nombre: c, total: redondear(ponderado(base.map(function (b) { return catMes[c][b.mes] || 0; }))) };
  }).sort(function (a, b) { return b.total - a.total; });

  // Cuotas (parcelas) que ya están comprometidas para los próximos meses
  var compras = {};
  movs.forEach(function (m) {
    var p = String(m.parcela || '').match(/^(\d+)\/(\d+)$/);
    if (!p || !(m.monto > 0)) return;
    var k = claveComercio(m.comercio) + '|' + p[2] + '|' + m.monto.toFixed(2);
    if (!compras[k] || +p[1] > compras[k].k) compras[k] = { k: +p[1], n: +p[2], mes: mesDe(m.fecha), monto: m.monto, nombre: nombreComercio(m.comercio) };
  });
  var cuotasMes = {}, activas = [];
  Object.keys(compras).forEach(function (k) {
    var c = compras[k], quedan = 0;
    for (var i = 1; i <= c.n - c.k; i++) {
      var mes = sumarMes(c.mes, i);
      if (mes <= mesActual) continue;
      cuotasMes[mes] = (cuotasMes[mes] || 0) + c.monto; quedan++;
    }
    if (quedan) activas.push({ nombre: c.nombre, monto: c.monto, quedan: quedan, de: c.n });
  });
  var cuotas = {
    porMes: Object.keys(cuotasMes).sort().map(function (m) { return { mes: m, total: redondear(cuotasMes[m]) }; }),
    activas: activas.sort(function (a, b) { return b.monto - a.monto; })
  };
  cuotas.pendiente = redondear(suma(cuotas.porMes, function (x) { return x.total; }));

  var pronostico = {
    mes: sumarMes(mesActual, 1),
    total: redondear(totalPron),
    min: redondear(Math.max(0, totalPron - var6)),
    max: redondear(totalPron + var6),
    porCategoria: porCategoria,
    cuotas: cuotas.porMes.length && cuotas.porMes[0].mes === sumarMes(mesActual, 1) ? cuotas.porMes[0].total : 0,
    base: base.length
  };

  return {
    meses: meses, actual: actual, mesMayor: mesMayor, promedio: redondear(promedio),
    periodo: periodo, totalPeriodo: redondear(totalPeriodo), nPeriodo: enPeriodo.length,
    topCategorias: topCategorias, topComercios: topComercios, frecuentes: frecuentes,
    porDiaSemana: porDiaSemana.map(redondear), porHora: porHora.map(redondear), conHora: conHora,
    hormiga: { n: hormiga.length, total: redondear(suma(hormiga, function (m) { return m.monto; })) },
    pronostico: pronostico, cuotas: cuotas,
    credito: evaluarCredito(gastos, meses, completos, cuotas, cfg, mesActual, movs)
  };
}

/** Evaluación simple de la actitud con el crédito: puntaje 0–100 + hallazgos en lenguaje claro. */
function evaluarCredito(gastos, meses, completos, cuotas, cfg, mesActual, movs) {
  var ultimos = completos.filter(function (m) { return m.n > 0; }).slice(-3);
  var desde = ultimos.length ? ultimos[0].mes : mesActual;
  var gastoTot = suma(ultimos, function (m) { return m.total; });
  var credTot = suma(ultimos, function (m) { return m.credito; });
  var credMensual = ultimos.length ? credTot / ultimos.length : 0;
  var parte = gastoTot ? credTot / gastoTot : 0;
  var ingreso = parseFloat(String(cfg.ingreso_mensual || '').replace(',', '.')) || 0;
  var tope = parseFloat(String(cfg.tope_tarjeta_mes || '').replace(',', '.')) || 0;
  var reciente = gastos.filter(function (m) { return mesDe(m.fecha) >= desde; });
  var intereses = reciente.filter(function (m) { return m.categoria === 'Préstamos e intereses'; });
  var totInt = suma(intereses, function (m) { return m.monto; });
  var proxCuotas = cuotas.porMes.length ? cuotas.porMes[0].total : 0;
  var credConHora = reciente.filter(function (m) { return m.metodo === 'credito' && m.hora; });
  var nocturnas = credConHora.filter(function (m) { var h = +m.hora.slice(0, 2); return h >= 22 || h < 5; });
  var actual = meses[meses.length - 1];
  var tendencia = ultimos.length >= 3 ? (ultimos[2].credito - (ultimos[0].credito + ultimos[1].credito) / 2) / Math.max(1, (ultimos[0].credito + ultimos[1].credito) / 2) : 0;

  var puntaje = 100, h = [];
  function add(nivel, titulo, texto, resta) { h.push({ nivel: nivel, titulo: titulo, texto: texto }); puntaje -= resta || 0; }
  var R = function (n) { return 'R$ ' + Math.round(n).toLocaleString('pt-BR'); };

  if (totInt > 0) add('riesgo', 'Estás pagando intereses o préstamos',
    'En los últimos meses salieron ' + R(totInt) + ' en préstamos, intereses, IOF o multas. Es la plata más cara que existe: prioriza terminar de pagarlo antes de nuevas compras en cuotas.', 30);
  else add('bien', 'Sin intereses ni préstamos', 'No aparece ningún pago de intereses, rotativo o préstamo. Sigue pagando la factura completa.', 0);

  if (ingreso) {
    var r = credMensual / ingreso;
    if (r > 0.4) add('riesgo', 'La tarjeta se lleva ' + Math.round(r * 100) + '% de tu ingreso', 'Gastas en promedio ' + R(credMensual) + ' al mes con crédito. Con más de 40% del ingreso, cualquier imprevisto termina en el rotativo.', 20);
    else if (r > 0.25) add('atento', 'La tarjeta usa ' + Math.round(r * 100) + '% de tu ingreso', 'Promedio de ' + R(credMensual) + '/mes con crédito. Lo sano es quedarse por debajo de 25–30%.', 10);
    else add('bien', 'Crédito bajo control', 'Usas ' + Math.round(r * 100) + '% de tu ingreso en la tarjeta (' + R(credMensual) + '/mes).', 0);
  } else {
    add('atento', 'Falta tu ingreso mensual', 'Cárgalo en Ajustes para saber qué parte de tu sueldo se va en la tarjeta.', 0);
  }

  if (proxCuotas > 0) {
    var rc = ingreso ? proxCuotas / ingreso : 0;
    var nivel = (rc > 0.15 || cuotas.activas.length >= 5) ? 'riesgo' : (rc > 0.08 || cuotas.activas.length >= 3 ? 'atento' : 'bien');
    add(nivel, cuotas.activas.length + ' compra' + (cuotas.activas.length === 1 ? '' : 's') + ' en cuotas activas',
      'El mes que viene ya debes ' + R(proxCuotas) + ' en parcelas, antes de comprar nada. Total pendiente: ' + R(cuotas.pendiente) + '.',
      nivel === 'riesgo' ? 15 : nivel === 'atento' ? 8 : 0);
  }

  if (tope && actual) {
    if (actual.credito > tope) add('riesgo', 'Pasaste tu tope de tarjeta este mes', 'Llevas ' + R(actual.credito) + ' con crédito y tu tope es ' + R(tope) + '. Lo que sigue va a la factura del mes que viene.', 10);
    else add(actual.credito > tope * 0.8 ? 'atento' : 'bien', 'Tope de tarjeta: ' + R(actual.credito) + ' de ' + R(tope), 'Te quedan ' + R(tope - actual.credito) + ' este mes.', 0);
  }

  if (tendencia > 0.15) add('atento', 'El uso de la tarjeta viene subiendo', 'El último mes usaste ' + Math.round(tendencia * 100) + '% más crédito que en los dos anteriores.', 10);
  else if (tendencia < -0.15) add('bien', 'El uso de la tarjeta viene bajando', 'El último mes usaste ' + Math.round(-tendencia * 100) + '% menos crédito que antes. Buen camino.', 0);

  if (parte > 0.85) add('atento', 'Casi todo pasa por la tarjeta', Math.round(parte * 100) + '% de lo que gastas es con crédito. No es malo si pagas la factura completa, pero hace más fácil perder la cuenta.', 5);

  if (credConHora.length >= 10 && nocturnas.length / credConHora.length > 0.1) {
    add('atento', 'Compras de madrugada', Math.round(nocturnas.length / credConHora.length * 100) + '% de tus compras con tarjeta son entre las 22 h y las 5 h (' + R(suma(nocturnas, function (m) { return m.monto; })) + '). Suelen ser compras por impulso, como el delivery.', 5);
  }

  var hormiga = reciente.filter(function (m) { return m.monto < 50; });
  var totRec = suma(reciente, function (m) { return m.monto; });
  if (totRec && suma(hormiga, function (m) { return m.monto; }) / totRec > 0.12) {
    add('atento', 'Gastos hormiga', hormiga.length + ' compras chicas (menos de R$ 50) suman ' + R(suma(hormiga, function (m) { return m.monto; })) + ' en el período. Juntas pesan.', 5);
  }

  puntaje = Math.max(0, Math.min(100, puntaje));
  var orden = { riesgo: 0, atento: 1, bien: 2 };
  h.sort(function (a, b) { return orden[a.nivel] - orden[b.nivel]; });
  return {
    puntaje: puntaje,
    nivel: puntaje >= 75 ? 'bien' : puntaje >= 50 ? 'atento' : 'riesgo',
    etiqueta: puntaje >= 75 ? 'Sano' : puntaje >= 50 ? 'Atento' : 'En riesgo',
    parteCredito: parte, creditoMensual: redondear(credMensual), proxCuotas: proxCuotas, intereses: redondear(totInt),
    hallazgos: h
  };
}

/** Datos de ejemplo (inventados) para ver el tablero sin conectar nada. */
function datosDemo(hoy) {
  var semilla = 7;
  function rnd() { semilla = (semilla * 16807) % 2147483647; return (semilla - 1) / 2147483646; }
  function entre(a, b) { return a + rnd() * (b - a); }
  function elegir(xs) { return xs[Math.floor(rnd() * xs.length)]; }
  var movs = [], id = 0, mesActual = mesDe(hoy), diaHoy = +hoy.slice(8, 10);
  function hora(perfil) {
    var h = perfil === 'noche' ? elegir([19, 20, 21, 22, 23, 0]) : perfil === 'dia' ? Math.floor(entre(8, 21)) : Math.floor(entre(9, 23));
    return ('0' + h).slice(-2) + ':' + ('0' + Math.floor(entre(0, 60))).slice(-2);
  }
  function add(ym, d, comercio, monto, categoria, cuenta, metodo, h, parcela) {
    var limite = ym === mesActual ? diaHoy : diasDelMes(ym);
    if (d > limite) return;
    movs.push({ id: 'd' + (id++), fecha: ym + '-' + ('0' + d).slice(-2), hora: h || '', comercio: comercio, monto: Math.round(monto * 100) / 100,
      categoria: categoria, cuenta: cuenta, metodo: metodo, origen: h ? 'ApplePay' : 'CSV', parcela: parcela || '', nota: '' });
  }
  for (var i = -6; i <= 0; i++) {
    var ym = sumarMes(mesActual, i), D = diasDelMes(ym), extra = i === -3 ? 1.35 : 1;
    add(ym, 5, 'Aluguel QuintoAndar', 4550.78, 'Alquiler', 'Itaú', 'boleto');
    add(ym, 10, 'Condomínio', 895.11, 'Alquiler', 'Itaú', 'boleto');
    add(ym, 12, 'Light Energia', entre(180, 260), 'Casa y servicios', 'Itaú', 'debito');
    add(ym, 12, 'Claro Internet', 129.9, 'Casa y servicios', 'Itaú', 'debito');
    add(ym, 20, 'DAS Simples Nacional', 483.33, 'Impuestos y contador', 'Inter PJ', 'boleto');
    add(ym, 15, 'Contador', 300, 'Impuestos y contador', 'Inter PJ', 'pix');
    [['Apple One', 64.9], ['Claude.ai', 110], ['Adobe', 124], ['Google One', 49.99], ['Splice', 69]].forEach(function (s, k) {
      add(ym, 3 + k, s[0], s[1], 'Suscripciones y apps', 'Nubank', 'credito');
    });
    var nSuper = Math.floor(entre(8, 12));
    for (var k = 0; k < nSuper; k++) add(ym, Math.ceil(entre(1, D)), elegir(['Supermercados Zona Sul', 'Prezunic', 'Hortifruti', 'Pão de Açúcar']), entre(45, 360) * extra, 'Supermercado', 'Nubank', 'credito', hora('dia'));
    var nFood = Math.floor(entre(6, 14) * extra);
    for (k = 0; k < nFood; k++) add(ym, Math.ceil(entre(1, D)), elegir(['iFood', 'iFood', 'Rappi', 'Padaria Flamengo', 'Bar do Adonis']), entre(28, 110), 'Restaurantes y delivery', 'Nubank', 'credito', hora('noche'));
    var nUber = Math.floor(entre(8, 18));
    for (k = 0; k < nUber; k++) add(ym, Math.ceil(entre(1, D)), elegir(['Uber *Trip', '99 Pop']), entre(11, 46), 'Transporte', elegir(['Nubank', 'Itaú']), 'credito', hora());
    for (k = 0; k < 2; k++) add(ym, Math.ceil(entre(1, D)), elegir(['Drogaria Pacheco', 'Droga Raia']), entre(25, 140), 'Salud y farmacia', 'Itaú', 'debito', hora('dia'));
    add(ym, Math.ceil(entre(1, D)), 'Pix enviado - Amigo', entre(150, 600), 'Personas (Pix)', 'Nubank', 'pix');
    if (i === -3) { add(ym, 14, 'LATAM Airlines', 1290, 'Viajes', 'Nubank', 'credito', '23:41'); add(ym, 18, 'Airbnb', 980, 'Viajes', 'Nubank', 'credito', '22:10'); }
    if (i >= -2 && i <= 0) add(ym, 8, 'Renner - Parcela ' + (i + 3) + '/4', 191.92, 'Ropa y compras', 'Nubank', 'credito', '', (i + 3) + '/4');
    if (i >= -1) add(ym, 9, 'Casa Video - Parcela ' + (i + 2) + '/6', 228.16, 'Casa y servicios', 'Itaú', 'credito', '', (i + 2) + '/6');

<script id="plan">
// Mi Mes: lógica pura (sin DOM). Lo prueba test/test.js.
var PRIORIDADES = ['urgente', 'importante', 'normal'];
var GRUPOS_BASE = ['Vivir', 'Impuestos', 'Tarjetas', 'Plazos', 'Personas', 'Suscripciones', 'Otros'];

function mesesEntre(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }
function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function ingresoMes(cfg, M) { return num(cfg['ingreso_' + M]) || num(cfg.ingreso_mensual); }

// Lo gastado con crédito en un mes (opcionalmente de una cuenta)
function gastoTarjeta(movs, cuenta, mes) {
  return redondear(suma(movs.filter(function (m) {
    return esGasto(m) && m.metodo === 'credito' && mesDe(m.fecha) === mes && (!cuenta || m.cuenta === cuenta);
  }), function (m) { return m.monto; }));
}

/** Lo que el ítem pide en el mes M, o null si ese mes no toca. */
function ocurrencia(item, M, ctx) {
  if (!item.mes_inicio) return null;
  var d = mesesEntre(item.mes_inicio, M);
  if (d < 0) return null;
  var o = { item: item, mes: M, monto: num(item.monto), n: null, estimado: false, atrasado: false };
  if (item.tipo === 'unico') {
    if (d !== 0) return null;
  } else if (item.tipo === 'cuotas') {
    var n = num(item.pagadas_previas) + d + 1;
    if (n > (num(item.cuotas_total) || 1)) return null;
    o.n = n;
  } else if (item.tipo === 'tarjeta') {
    // La factura de M son las compras con tarjeta de M-1, si ya las estabas registrando
    var prev = sumarMes(M, -1);
    if (prev >= item.mes_inicio) o.monto = gastoTarjeta(ctx.movs, item.cuenta, prev);
    else o.estimado = true;

/** El mes M: qué hay por pagar, qué ya se pagó, cuánto sobra. En el mes actual suma lo atrasado. */
function vistaMes(d, M, mesHoy) {
  var ctx = { movs: d.movs || [], pagos: d.pagos || [] };
  var occ = [];
  (d.plan || []).forEach(function (it) {
    var o = ocurrencia(it, M, ctx);
    if (o) occ.push(o);

      for (var X = it.mes_inicio; X < M; X = sumarMes(X, 1)) {
        var a = ocurrencia(it, X, ctx);

  var entra = ingresoMes(d.cfg || {}, M);

  var pagados = occ.filter(function (o) { return o.pago; });
  var pagado = redondear(suma(pagados, function (o) { return o.monto; }));
  return {
    mes: M, entra: entra, pagar: pagar, pagado: pagado,
    falta: redondear(pagar - pagado), sobra: redondear(entra - pagar),
    pct: pagar ? pagado / pagar : 0,

/** prioridad: urgentes → importantes → normales, cada uno de mayor a menor. monto: todo de mayor a menor. */

    if (modo === 'prioridad') {

      if (pa < 0) pa = 2; if (pb < 0) pb = 2;

/** Grupos ordenados por su total (mayor primero) y dentro de cada uno de mayor a menor. */
function agruparPagos(lista) {

/** Deudas = ítems en cuotas. Cada pago registrado suma una cuota. */
function resumenDeudas(d) {
  var lista = (d.plan || []).filter(function (it) { return it.tipo === 'cuotas'; }).map(function (it) {
    var pagos = (d.pagos || []).filter(function (p) { return p.item === it.id; });

  });
  var deuda = suma(lista, function (x) { return x.deuda; }), falta = suma(lista, function (x) { return x.falta; });
  return {
    activas: lista.filter(function (x) { return !x.terminada; }).sort(function (a, b) { return b.falta - a.falta; }),
    terminadas: lista.filter(function (x) { return x.terminada; }),
    falta: redondear(falta), pct: deuda ? 1 - falta / deuda : 0

}

/** Los próximos n meses: cuánto entra, cuánto hay que pagar y cuánto sobra. */
function miAnio(d, desde, n) {
  var ctx = { movs: d.movs || [], pagos: d.pagos || [] }, filas = [];

  }

}

/** Metas cumplidas: deudas terminadas y sueños logrados, lo más nuevo primero. */
function metasCumplidas(d) {

<script id="pdf">
// Extractos en PDF de Itaú y Nubank: del PDF a líneas de texto, y de las líneas a movimientos.
// Lo prueba test/test.js con líneas de ejemplo.
var MESES_PT = { JAN: '01', FEV: '02', MAR: '03', ABR: '04', MAI: '05', JUN: '06', JUL: '07', AGO: '08', SET: '09', OUT: '10', NOV: '11', DEZ: '12' };

function valorBr(s) { return parseFloat(String(s).replace(/\s/g, '').replace(/\./g, '').replace(',', '.')); }
function sinAcentos(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

/** Nombre del titular: el texto antes del CPF, o la línea anterior si el CPF va solo. */
function titularDe(lineas) {
  for (var i = 0; i < Math.min(lineas.length, 12); i++) {
    var l = lineas[i];
    if (/CPF|\d{3}\.\d{3}\.\d{3}-\d{2}|•••\.\d{3}/.test(l)) {
      var antes = l.split(/CPF|\d/)[0].trim();
      return antes || (lineas[i - 1] || '').trim();
    }
  }
  return '';
}
/** Pix o transferencia a una cuenta propia (mismo nombre del titular). */
function esPropia(desc, titular) {
  var n = sinAcentos(titular).split(/\s+/)[0].slice(0, 7), t = sinAcentos(desc);
  return n.length >= 4 && /pix|transf/.test(t) && t.indexOf(n) > -1;
}

function leerPdfBanco(lineas) {
  var texto = lineas.join('\n');
  if (/SALDO DO DIA/.test(texto) && /itau|lan[cç]amentos/i.test(texto)) return { banco: 'Itaú', filas: pdfItau(lineas) };
  if (/Movimenta[cç][oõ]es/.test(texto) && /nubank|Nu Pagamentos|Total de (entradas|sa[ií]das)/i.test(texto)) return { banco: 'Nubank', filas: pdfNubank(lineas) };
  return null;
}

// Itaú: "26/10/2026 PAY ZONA 24/10 -303,62". La fecha al final de la descripción es el día real de la compra.
function pdfItau(lineas) {
  var titular = titularDe(lineas), filas = [];
  lineas.forEach(function (l) {
    l = l.replace(/\s+/g, ' ').trim();
    var m = l.match(/^(\d{2})\/(\d{2})\/(\d{4}) (.+?) (-?[\d.]+,\d{2})(?: -?[\d.]+,\d{2})?$/);
    if (!m || /SALDO (DO DIA|ANTERIOR|EM CONTA)/i.test(m[4])) return;
    var desc = m[4], fecha = m[3] + '-' + m[2] + '-' + m[1];
    var c = desc.match(/\s?(\d{2})\/(\d{2})$/);
    if (c) {
      desc = desc.slice(0, c.index).trim();
      fecha = (+m[3] - (+c[2] > +m[2] ? 1 : 0)) + '-' + c[2] + '-' + c[1];
    }
    if (esPropia(desc, titular)) desc += ' (entre contas)';
    filas.push({ fecha: fecha, descricao: desc, valor: valorBr(m[5]) });
  });
  return filas;
}

// Nubank cuenta: "02 OUT 2026" abre el día; "Total de entradas/saídas" dice el signo de las filas que siguen.
function pdfNubank(lineas) {
  var titular = titularDe(lineas), filas = [], fecha = null, signo = 1, dentro = false;
  lineas.forEach(function (l) {
    l = l.replace(/\s+/g, ' ').trim();
    if (/^Movimenta[cç][oõ]es/.test(l)) { dentro = true; return; }
    if (!dentro || !l) return;
    var d = l.match(/^(\d{2}) ([A-Z]{3}) (\d{4})(?: (.*))?$/);
    if (d && MESES_PT[d[2]]) { fecha = d[3] + '-' + MESES_PT[d[2]] + '-' + d[1]; l = d[4] || ''; }
    if (/^Total de entradas/i.test(l)) { signo = 1; return; }
    if (/^Total de sa[ií]das/i.test(l)) { signo = -1; return; }
    var m = l.match(/^(.+?) ([\d.]+,\d{2})$/);
    if (!m || !fecha || /^(Saldo|Rendimento l)/i.test(m[1])) return;
    var desc = m[1].replace(/ - [•\d.\/-]{6,}.*$/, '').replace(/\s*\(Transfer[eê]ncia$/i, '').trim();
    if (esPropia(desc, titular)) desc += ' (entre contas)';
    filas.push({ fecha: fecha, descricao: desc, valor: signo * valorBr(m[2]) });
  });
  return filas;
}

/** Arma las líneas de un documento de pdf.js: agrupa los textos por altura y los ordena de izquierda a derecha. */
function lineasDePdf(doc) {
  var paginas = [];
  for (var p = 1; p <= doc.numPages; p++) paginas.push(p);
  return paginas.reduce(function (prom, p) {
    return prom.then(function (todas) {
      return doc.getPage(p).then(function (pag) { return pag.getTextContent(); }).then(function (tc) {
        var filas = [];
        tc.items.forEach(function (it) {
          if (!it.str || !it.str.trim()) return;
          var y = it.transform[5], x = it.transform[4];
          var f = filas.filter(function (r) { return Math.abs(r.y - y) < 3; })[0];
          if (!f) { f = { y: y, items: [] }; filas.push(f); }
          f.items.push({ x: x, s: it.str });
        });
        filas.sort(function (a, b) { return b.y - a.y; });
        return todas.concat(filas.map(function (f) {
          return f.items.sort(function (a, b) { return a.x - b.x; }).map(function (i) { return i.s.trim(); }).join(' ');
        }));
      });
    });
  }, Promise.resolve([]));
}

/** Movimientos → el CSV que entiende el servidor (data, descricao, valor, origem). */
function csvDePdf(r) {
  return 'data,descricao,valor,origem\n' + r.filas.map(function (f) {
    return [f.fecha, '"' + f.descricao.replace(/"/g, '""') + '"', f.valor, r.banco].join(',');
  }).join('\n');
}

  $('#vista').innerHTML = '<section class="card"><h2>No pude leer tus datos</h2><p class="muted" style="margin:0">' + esc(e.message) +
    '</p><div class="acciones"><button class="btn prim" data-accion="reintentar">Reintentar</button>' +
    (conectado === 'web' ? '<button class="btn" data-accion="desconectar">Cambiar conexión</button>' : '') + '</div></section>';
}
function cargar() {
  if (conectado === 'gas') {
    google.script.url.getLocation(function (loc) {
      S.k = (loc.parameter && loc.parameter.k) || '';
      llamar('api_datos').then(recibir).catch(fallo);
    });
    return;
  }
  if (conectado === 'web') {
    S.k = ajuste('k');
    if (!S.movs.length) $('#estado').textContent = 'Cargando…';
    llamar('api_datos').then(recibir).catch(fallo);
    return;
  }
  S.movs = datosDemo(hoy); S.demo = true; S.categorias = CATS_DEFECTO;
  var P = planDemo(hoy);
  S.plan = P.plan; S.pagos = P.pagos; S.suenos = P.suenos; S.cfg = P.cfg;
  $('#estado').textContent = 'Ejemplo';
  render();
}
function conectar() {
  var api = $('#cx-api').value.trim(), k = $('#cx-k').value.trim();
  var m = api.match(/\/macros\/s\/([^/]+)\/exec/);
  if (!m && !/^[\w-]{20,}$/.test(api)) { aviso('Pega la dirección que termina en /exec'); return; }
  if (!k) { aviso('Falta la clave'); return; }
  ajuste('api', m ? m[1] : api); ajuste('k', k);
  conectado = 'web'; S.tab = 'resumen'; cargar();
}
function desconectar() {
  ajuste('api', null); ajuste('k', null);
  conectado = ''; S.tab = 'ajustes'; cargar();
}

// Sale la pantalla de apertura cuando hay datos (mínimo ~1,1 s para que se vea la animación)
var inicioApp = Date.now(), splashFuera = false;
var sinMovimiento = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function quitarSplash() {
  if (splashFuera) return;
  splashFuera = true;
  var sp = $('#splash');
  if (!sp) return;
  setTimeout(function () {
    var v = $('#vista');
    sp.classList.add('fuera');
    if (!sinMovimiento) { v.classList.add('entra'); contarMonto(); }
    setTimeout(function () { sp.remove(); v.classList.remove('entra'); }, 1300);
  }, Math.max(0, 1100 - (Date.now() - inicioApp)));
}
setTimeout(quitarSplash, 8000);
// El monto del mes cuenta desde 0
function contarMonto() {
  var el = document.querySelector('.hero-monto[data-valor]');
  if (!el) return;
  var fin = +el.dataset.valor, t0 = null, dur = 900;
  function paso(t) {
    t0 = t0 || t;
    var x = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - x, 3);
    el.innerHTML = montoGrande(fin * e);
    if (x < 1) requestAnimationFrame(paso);
  }
  el.innerHTML = montoGrande(0);
  setTimeout(function () { requestAnimationFrame(paso); }, 250);
}

// "R$ 11.686,30" con los centavos más chicos
function montoGrande(n) {
  var p = brl.format(n || 0).replace(/^-?R\$\s*/, '').split(',');
  return '<span class="moneda">R$</span>' + p[0] + '<span class="cent">,' + (p[1] || '00') + '</span>';
}
// Medio círculo de 0 a 100
function gauge(p, nivel) {
  var col = { bien: 'var(--good)', atento: 'var(--warn)', riesgo: 'var(--bad)' }[nivel];
  var arco = 'M12 60 A48 48 0 0 1 108 60';
  return '<svg class="gauge" viewBox="0 0 120 70" role="img" aria-label="Puntaje ' + p + ' de 100">' +
    '<path d="' + arco + '" pathLength="100" style="fill:none;stroke:var(--surface-2);stroke-width:11;stroke-linecap:round"/>' +
    '<path d="' + arco + '" pathLength="100" style="fill:none;stroke:' + col + ';stroke-width:11;stroke-linecap:round;stroke-dasharray:' + Math.max(p, 0.5) + ' 100"/>' +
    '<text x="60" y="58" text-anchor="middle" style="fill:var(--ink);font:800 28px Manrope, sans-serif">' + p + '</text></svg>';
}
function rapida(attr, texto, ico, prim) {
  return '<button class="rapida' + (prim ? ' prim' : '') + '" ' + attr + '><span class="circ">' + ico + '</span>' + texto + '</button>';
}

function vResumen(A) {

      : d < -0.05 ? '<span class="pill bien">↓ ' + pct + '% bajo tu promedio</span>'

  }

  return '' +
    '<section class="hero">' +
      '<span class="eyebrow">Gastado en ' + MESES_L[+a.mes.slice(5, 7) - 1] + '</span>' +

      '<div class="barra-mes" data-tip="Gastado ' + R0(a.total) + ' · cierre estimado ' + R0(a.proyeccion) + (A.promedio ? ' · promedio ' + R0(A.promedio) : '') + '">' +
        '<i style="width:' + (a.total / tope * 100).toFixed(1) + '%"></i>' +
        (A.promedio ? '<b style="left:' + (A.promedio / tope * 100).toFixed(1) + '%"></b>' : '') + '</div>' +
      '<div class="barra-leg"><span>Día ' + a.dia + ' de ' + a.dias + '</span><span>Cierre estimado <b style="color:var(--ink)">' + R0(a.proyeccion) + '</b></span></div>' +
    '</section>' +
    '<section class="rapidas">' +
      rapida('data-accion="agregar"', 'Agregar', ICO.mas, true) +
      rapida('data-accion="importar"', 'Importar', ICO.subir) +
      rapida('data-ir="mimes"', 'Mi Mes', ICO.lista) +
      rapida('data-ir="analisis"', 'Análisis', ICO.barras) +
    '</section>' + tarjetaMiMes() + tarjetaCuentas() +
    '<section class="duo">' +
      '<div class="mini"><span class="eyebrow">Próximo mes</span><span class="v num">' + R0(p.total) + '</span><span class="small muted">' + (p.base ? 'entre ' + R0(p.min) + ' y ' + R0(p.max) : 'faltan meses de historia') + '</span></div>' +
      '<button class="mini" data-ir="credito"><span class="eyebrow">Crédito</span>' + gauge(c.puntaje, c.nivel) + '<span class="pill ' + c.nivel + '">' + c.etiqueta + '</span></button>' +
    '</section>' +
    '<section class="card"><div class="card-cab"><h2>Gasto por mes</h2>' + (A.mesMayor && A.mesMayor.total > 0 ? '<span class="small muted">Mayor: ' + nomMes(A.mesMayor.mes, true) + '</span>' : '') + '</div>' + graficoMeses(A) + '</section>' +
    (A.topCategorias.length ? '<section class="card"><div class="card-cab"><h2>En qué gastas</h2><button class="link" data-ir="analisis">Ver más</button></div>' +
      ranking(A.topCategorias.slice(0, 4), valR0, function (x) { return Math.round(x.pct * 100) + '% · ' + etiquetaPeriodo(); }) + '</section>' : '') +
    '<section class="card"><div class="card-cab"><h2>Recientes</h2><button class="link" data-ir="movimientos">Ver todos</button></div>' +
      (ult.length ? '<div class="lista">' + ult.map(filaMov).join('') + '</div>' : '<p class="vacio">Todavía no hay compras. Paga algo con Apple Pay o importa un extracto.</p>') +
    '</section>';
}
function tile(t, v, s) { return '<div class="tile"><span class="eyebrow">' + t + '</span><span class="v num">' + v + '</span><span class="small muted">' + s + '</span></div>'; }
function etiquetaPeriodo() { return { mes: 'este mes', '3m': '3 meses', '12m': '12 meses', todo: 'todo el historial' }[S.periodo]; }

function graficoMeses(A) {
  var meses = A.meses.slice(-12);
  var cols = meses.map(function (m) { return { etq: nomMes(m.mes), val: m.total, tip: nomMes(m.mes, true) + ': ' + R0(m.total) + ' (' + R0(m.credito) + ' con crédito)', clase: m.mes === A.actual.mes ? 'atenuada' : '' }; });
  if (A.pronostico.base) cols.push({ etq: nomMes(A.pronostico.mes), val: A.pronostico.total, tip: 'Pronóstico ' + nomMes(A.pronostico.mes, true) + ': ' + R0(A.pronostico.total) + ' (entre ' + R0(A.pronostico.min) + ' y ' + R0(A.pronostico.max) + ')', clase: 'pron' });
  var max = Math.max.apply(null, cols.map(function (c) { return c.val; }).concat([1]));
  var iMax = -1; cols.forEach(function (c, i) { if (c.clase !== 'pron' && (iMax < 0 || c.val > cols[iMax].val)) iMax = i; });
  return '<div class="cols" role="img" aria-label="Gasto por mes">' + cols.map(function (c, i) {
    var h = c.val / max * 100;
    var etiqueta = (i === iMax || c.clase === 'pron' || i === cols.length - 2) ? '<span class="val num" style="bottom:calc(' + h + '% + 3px)">' + corto(c.val) + '</span>' : '';
    return '<div class="col ' + c.clase + '" data-tip="' + esc(c.tip) + '" tabindex="0">' + etiqueta + '<div class="barra" style="height:' + h + '%"></div></div>';
  }).join('') + '</div><div class="col-ejes">' + cols.map(function (c) { return '<span>' + c.etq + '</span>'; }).join('') + '</div>' +
  '<div class="leyenda"><span><i></i>Gasto</span><span><i class="curso"></i>Mes en curso</span><span><i class="pron"></i>Pronóstico</span></div>';
}

function filaMov(m) {
  var exc = EXCLUIDAS.indexOf(m.categoria) > -1;
  var ini = nombreComercio(m.comercio).replace(/[^0-9A-Za-zÀ-ÿ]/g, '').slice(0, 1).toUpperCase() || '·';
  return '<button class="mov' + (exc ? ' excluido' : '') + '" data-mov="' + esc(m.id) + '">' +
    '<span class="av">' + esc(ini) + '</span>' +
    '<span style="min-width:0"><span class="nom">' + esc(m.comercio) + '</span>' +
    '<span class="meta">' + esc(m.categoria) + (m.hora ? ' · ' + esc(m.hora) : '') + ' · ' + esc(m.cuenta) + (m.parcela ? ' · cuota ' + esc(m.parcela) : '') + '</span></span>' +
    '<span class="m' + (m.monto < 0 ? ' entrada' : '') + '">' + (m.monto < 0 ? '+ ' : '') + R(Math.abs(m.monto)) + '</span></button>';
}

function vMovimientos() {
  var meses = {}; S.movs.forEach(function (m) { meses[mesDe(m.fecha)] = true; });
  var lista = S.movs.filter(function (m) {
    if (S.mesFiltro && mesDe(m.fecha) !== S.mesFiltro) return false;
    if (!S.busca) return true;
    var t = (m.comercio + ' ' + m.categoria + ' ' + m.cuenta + ' ' + m.nota).toLowerCase();
    return t.indexOf(S.busca.toLowerCase()) > -1;
  });
  var dias = {}, orden = [];
  lista.slice(0, 400).forEach(function (m) { if (!dias[m.fecha]) { dias[m.fecha] = []; orden.push(m.fecha); } dias[m.fecha].push(m); });

    '<select id="mesFiltro"><option value="">Todos los meses</option>' + Object.keys(meses).sort().reverse().map(function (ym) {

      return '<div class="dia"><div class="dia-cab"><span>' + d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'short', timeZone: 'UTC' }) + '</span><span class="num">' + R(tot) + '</span></div>' + dias[f].map(filaMov).join('') + '</div>';
    }).join('') : '<p class="vacio">Nada con ese filtro.</p>') +
    '<p class="small muted">Toca un movimiento para cambiar su categoría. Los atenuados (pago de tarjeta, transferencias, ingresos) no cuentan como gasto.</p>';
}

function segPeriodo() {
  return '<div class="segmento" role="group" aria-label="Período">' + [['mes', 'Mes'], ['3m', '3 meses'], ['12m', '12 meses'], ['todo', 'Todo']].map(function (p) {
    return '<button data-periodo="' + p[0] + '" aria-pressed="' + (S.periodo === p[0]) + '">' + p[1] + '</button>'; }).join('') + '</div>';
}
function ranking(items, valor, detalle) {
  var max = items.length ? items[0].total : 1;
  return '<ol class="rank">' + items.map(function (x) {
    return '<li><span class="nom">' + esc(x.nombre) + '</span><span class="num">' + valor(x) + '</span>' +
      '<span class="pista"><i style="width:' + (x.total / max * 100).toFixed(1) + '%"></i></span>' +
      '<span class="det">' + detalle(x) + '</span></li>';
  }).join('') + '</ol>';
}
function valR0(x) { return R0(x.total); }
function columnas(vals, etqs, tipFn) {
  var max = Math.max.apply(null, vals.concat([1]));
  var iMax = vals.indexOf(Math.max.apply(null, vals));
  return '<div class="cols" style="height:120px">' + vals.map(function (v, i) {
    var h = v / max * 100;
    return '<div class="col" data-tip="' + esc(tipFn(i, v)) + '" tabindex="0">' + (i === iMax && v > 0 ? '<span class="val num" style="bottom:calc(' + h + '% + 3px)">' + corto(v) + '</span>' : '') + '<div class="barra" style="height:' + h + '%"></div></div>';
  }).join('') + '</div><div class="col-ejes">' + etqs.map(function (e) { return '<span>' + e + '</span>'; }).join('') + '</div>';
}

function vAnalisis(A) {
  var p = A.pronostico;
  var horas = [], etqH = [];

  var diaMax = A.porDiaSemana.indexOf(Math.max.apply(null, A.porDiaSemana));
  var hMax = horas.indexOf(Math.max.apply(null, horas)) * 2;
  return '' +
    '<div class="card-cab"><h2>Tus gastos en ' + etiquetaPeriodo() + '</h2>' + segPeriodo() + '</div>' +
    '<section class="tiles">' +
      tile('Total', R0(A.totalPeriodo), A.nPeriodo + ' compras') +
      tile('Día que más gastas', A.nPeriodo ? DIAS[diaMax] : '—', 'de la semana') +
      tile('Hora pico', A.conHora ? hMax + '–' + (hMax + 2) + ' h' : '—', A.conHora ? 'según Apple Pay' : 'sin datos de hora') +
      tile('Gastos hormiga', R0(A.hormiga.total), A.hormiga.n + ' compras < R$ 50') +
    '</section>' +
    '<section class="card"><h2>En qué gastas</h2>' + ranking(A.topCategorias, valR0, function (x) { return Math.round(x.pct * 100) + '% · ' + x.n + ' compras'; }) + '</section>' +
    '<section class="card"><h2>Dónde más gastas</h2>' + ranking(A.topComercios, valR0, function (x) { return x.n + ' compras · promedio ' + R0(x.total / x.n); }) + '</section>' +
    '<section class="card"><h2>Lo que más compras</h2><p class="small muted" style="margin:0">Por cantidad de veces, no por monto.</p>' +
      ranking(A.frecuentes.map(function (x) { return { nombre: x.nombre, total: x.n, n: x.n, real: x.total }; }), function (x) { return x.n + '×'; }, function (x) { return R0(x.real) + ' en total'; }) +
    '</section>' +
    '<section class="card"><h2>Por día de la semana</h2>' + columnas(A.porDiaSemana, DIAS, function (i, v) { return DIAS[i] + ': ' + R0(v); }) + '</section>' +
    (A.conHora ? '<section class="card"><h2>Por hora del día</h2>' + columnas(horas, etqH, function (i, v) { return (i * 2) + '–' + (i * 2 + 2) + ' h: ' + R0(v); }) + '<p class="small muted" style="margin:0">Solo compras con hora (Apple Pay y gastos rápidos).</p></section>' : '') +
    '<section class="card"><div class="card-cab"><h2>Pronóstico de ' + nomMes(p.mes, true) + '</h2></div>' +
      (p.base ? '<p style="margin:0">Esperamos unos <b>' + R0(p.total) + '</b> (entre ' + R0(p.min) + ' y ' + R0(p.max) + '), según tus últimos ' + p.base + ' meses' + (p.cuotas ? ', de los cuales <b>' + R0(p.cuotas) + '</b> ya son cuotas comprometidas' : '') + '.</p>' +
        ranking(p.porCategoria.slice(0, 6).map(function (c) { return { nombre: c.nombre, total: c.total, n: 0 }; }), valR0, function () { return 'estimado'; })
        : '<p class="muted" style="margin:0">Necesito al menos un mes completo de datos.</p>') +
    '</section>' +
    (A.cuotas.porMes.length ? '<section class="card"><h2>Cuotas que ya debes</h2><div class="tabla-wrap"><table><thead><tr><th>Mes</th><th>Cuotas</th></tr></thead><tbody>' +

      A.meses.slice().reverse().map(function (m) { return '<tr><td>' + nomMes(m.mes, true) + (A.mesMayor && m.mes === A.mesMayor.mes ? ' <span class="pill atento">mayor</span>' : '') + '</td><td>' + R0(m.total) + '</td><td>' + R0(m.credito) + '</td><td>' + m.n + '</td></tr>'; }).join('') +

// pdf.js se carga solo cuando hace falta leer un PDF
var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function cargarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise(function (ok, mal) {
    var sc = document.createElement('script');
    sc.src = PDFJS + 'pdf.min.js';
    sc.onload = function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = function () { mal(new Error('No pude cargar el lector de PDF. Revisa tu conexión.')); };
    document.head.appendChild(sc);
  });
}
function textoDePdf(file) {
  return cargarPdfJs()
    .then(function (lib) { return file.arrayBuffer().then(function (b) { return lib.getDocument({ data: new Uint8Array(b) }).promise; }); })
    .then(lineasDePdf)
    .then(function (lineas) {
      var r = leerPdfBanco(lineas);
      if (!r) throw new Error('no reconozco este PDF. Por ahora leo extractos de cuenta de Itaú y de Nubank.');
      if (!r.filas.length) throw new Error('el PDF no tiene movimientos.');
      return csvDePdf(r);
    });
}

function importar(file) {
  if (S.demo) { aviso('Importar funciona cuando abres tu tablero conectado'); return; }
  var leer = function (enc) {
    return new Promise(function (ok) { var fr = new FileReader(); fr.onload = function () { ok(fr.result); }; fr.readAsText(file, enc); });
  };
  var esPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
  aviso((esPdf ? 'Leyendo ' : 'Importando ') + file.name + '…');
  (esPdf ? textoDePdf(file) : leer('utf-8').then(function (t) { return t.indexOf('\uFFFD') > -1 ? leer('iso-8859-1') : t; }))
    .then(function (t) { return llamar('api_importar', file.name, t); })
    .then(function (r) { aviso(r.formato + ': ' + r.nuevos + ' nuevos, ' + r.conciliados + ' unidos con Apple Pay, ' + r.repetidos + ' ya estaban'); cargar(); })
    .catch(function (e) { aviso('No pude importar: ' + e.message); });
}

function haceCuanto(f) {
  if (!f) return '';
  var min = Math.round((Date.now() - new Date(String(f).replace(' ', 'T')).getTime()) / 60000);
  if (!(min >= 0)) return '';
  return min < 2 ? 'recién' : min < 60 ? 'hace ' + min + ' min' : min < 1440 ? 'hace ' + Math.round(min / 60) + ' h' : 'hace ' + Math.round(min / 1440) + ' días';
}
function tarjetaCuentas() {
  if (!S.cuentas.length) return '';

    if (c.tipo === 'tarjeta' && num(c.limite)) {

// Confeti para deudas terminadas y sueños cumplidos
function confeti() {
  if (sinMovimiento) return;
  var c = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.className = 'confeti'; document.body.appendChild(c);
  var W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr, x = c.getContext('2d');
  var colores = ['#a3ec74', '#f1f7ec', '#f4c862', '#7fd6a0'], ps = [];
  for (var i = 0; i < 150; i++) {
    ps.push({ x: W / 2, y: H * 0.45, vx: (Math.random() - 0.5) * 30 * dpr, vy: (-Math.random() * 30 - 8) * dpr, r: (5 + Math.random() * 8) * dpr,
      c: colores[i % colores.length], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4 });
  }
  var t0 = null;
  function paso(t) {
    t0 = t0 || t;
    var dt = t - t0;
    x.clearRect(0, 0, W, H);
    ps.forEach(function (p) {
      p.vy += 1.1 * dpr; p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - dt / 1900);
      x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore();
    });
    if (dt < 1900) requestAnimationFrame(paso); else c.remove();
  }
  requestAnimationFrame(paso);
}
