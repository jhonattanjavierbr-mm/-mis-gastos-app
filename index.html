<body>
<title>Mis Gastos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b1610">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: app de banco de una columna; saldo del mes arriba, acciones redondas, tarjetas y barra de pestañas fija abajo.
   Un solo tema oscuro a propósito (verde bosque + lima). */
:root {
  color-scheme: dark;
  --bg: #0b1610; --surface: #13231a; --surface-2: #1c3125; --line: #284232;
  --ink: #f1f7ec; --ink-2: #b7c9b5; --muted: #7d947f;
  --lima: #a3ec74; --lima-ink: #10290a; --lima-soft: #2a4a22;
  --good: #a3ec74; --warn: #f4c862; --bad: #ff8a78;
  --good-bg: #213f1c; --warn-bg: #3d3115; --bad-bg: #44201b;
  --f-display: "Manrope", "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 22px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 18px; }
h3 { font-size: 15px; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lima); outline-offset: 2px; }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: 13px; }

/* Encabezado */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 4px 18px; }
.marca { display: flex; align-items: center; gap: 10px; }
.marca .logo { width: 36px; height: 36px; border-radius: 12px; background: var(--lima); display: grid; place-items: center; }
.marca h1 { font-size: 19px; }
.chip-estado { font-size: 12px; color: var(--ink-2); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-weight: 600; }
.vista { display: grid; gap: 14px; }
.titulo-vista { font-size: 28px; padding-block: 2px 4px; }
.banner { background: var(--lima-soft); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 13px; }

/* Saldo del mes */
.hero { padding: 6px 2px 10px; display: grid; gap: 10px; }
.hero-monto { font-family: var(--f-display); font-weight: 800; font-size: clamp(46px, 14vw, 64px); line-height: 1; letter-spacing: -0.035em; display: flex; align-items: baseline; gap: 6px; }
.hero-monto .moneda { font-size: 0.38em; color: var(--ink-2); font-weight: 700; letter-spacing: 0; }
.hero-monto .cent { font-size: 0.42em; color: var(--muted); letter-spacing: -0.01em; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; width: fit-content; }
.pill.bien { background: var(--good-bg); color: var(--good); }
.pill.atento { background: var(--warn-bg); color: var(--warn); }
.pill.riesgo { background: var(--bad-bg); color: var(--bad); }
.pill.neutro { background: var(--surface); color: var(--ink-2); }
.barra-mes { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); margin-top: 4px; }
.barra-mes i { position: absolute; inset: 0 auto 0 0; background: var(--lima); border-radius: 5px; }
.barra-mes b { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); }
.barra-leg { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }

/* Acciones redondas */
.rapidas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-block: 6px 4px; }
.rapida { background: none; border: 0; display: grid; justify-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 0; }
.rapida .circ { width: 54px; height: 54px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--lima); transition: transform .15s; }
.rapida.prim .circ { background: var(--lima); color: var(--lima-ink); }
.rapida:active .circ { transform: scale(0.94); }

/* Tarjetas */
.card { background: var(--surface); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.link { background: none; border: 0; color: var(--lima); font-weight: 700; font-size: 14px; padding: 4px 0; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mini { background: var(--surface); border: 0; border-radius: var(--r); padding: 16px; display: grid; gap: 4px; align-content: start; text-align: left; min-width: 0; }
.mini .v { font-family: var(--f-display); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.gauge { width: 100%; max-width: 150px; height: auto; display: block; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: 21px; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }

/* Gráfico de columnas */
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; height: 160px; padding-top: 20px; }
.col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.col .barra { background: var(--lima); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.col.atenuada .barra { background: var(--lima-soft); box-shadow: inset 0 0 0 1.5px var(--lima); }
.col.pron .barra { background: repeating-linear-gradient(135deg, var(--lima) 0 2px, transparent 2px 7px); box-shadow: inset 0 0 0 1.5px var(--lima); }
.col .val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); white-space: nowrap; font-weight: 700; }
.col-ejes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; padding-top: 6px; }
.col-ejes span { text-align: center; font-size: 11px; color: var(--muted); overflow: hidden; }
.leyenda { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--lima); margin-right: 6px; vertical-align: -1px; }
.leyenda i.curso { background: var(--lima-soft); box-shadow: inset 0 0 0 1.5px var(--lima); }
.leyenda i.pron { background: repeating-linear-gradient(135deg, var(--lima) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1.5px var(--lima); }

/* Rankings */
.rank { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.rank li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.rank .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rank .num { font-weight: 700; }
.rank .pista { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.rank .pista i { display: block; height: 100%; background: var(--lima); border-radius: 3px; }
.rank .det { font-size: 12px; color: var(--muted); }

/* Movimientos */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; }
.filtros input, .filtros select { background: var(--surface); border: 0; border-radius: 99px; padding: 11px 16px; min-width: 0; }
.filtros input { flex: 1 1 170px; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.lista { display: grid; }
.dia { display: grid; }
.dia-cab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; padding: 14px 4px 6px; text-transform: capitalize; }
.mov { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 16px; padding: 10px 6px; }
.mov:hover, .mov:focus-visible { background: var(--surface-2); }
.av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; background: var(--surface-2); color: var(--ink); }
.card .av { background: var(--surface-2); }
.mov .nom { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mov .meta { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mov .m { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.mov .m.entrada { color: var(--lima); }
.mov.excluido { opacity: 0.55; }

/* Crédito */
.puntaje { display: grid; justify-items: center; gap: 8px; text-align: center; }
.puntaje .gauge { max-width: 240px; }
.hallazgos { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.hallazgos li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface-2); }
.hallazgos .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.hallazgos .bien .ic { background: var(--good-bg); color: var(--good); }
.hallazgos .atento .ic { background: var(--warn-bg); color: var(--warn); }
.hallazgos .riesgo .ic { background: var(--bad-bg); color: var(--bad); }
.metricas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* Tablas */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 9px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }

/* Botones, formularios, diálogo */
.btn { border: 0; background: var(--surface-2); border-radius: 99px; padding: 11px 18px; font-weight: 700; }
.btn.prim { background: var(--lima); color: var(--lima-ink); }
.btn.peligro { color: var(--bad); }
.segmento { display: inline-flex; gap: 4px; background: var(--surface); border-radius: 99px; padding: 4px; }
.segmento button { border: 0; background: none; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); border-radius: 99px; }
.segmento button[aria-pressed="true"] { background: var(--lima); color: var(--lima-ink); }
dialog { border: 0; border-radius: 26px; background: var(--surface); color: var(--ink); padding: 22px; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / 0.6); }
.form { display: grid; gap: 14px; }
.campo { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.campo input, .campo select { width: 100%; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 0; border-radius: 14px; padding: 12px 14px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.check input { accent-color: var(--lima); width: 18px; height: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--lima); color: var(--lima-ink); font-weight: 700; padding: 12px 18px; border-radius: 99px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }
#tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 10px; white-space: nowrap; }
.vacio { padding: 28px 12px; text-align: center; color: var(--muted); }

/* Barra de pestañas */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; justify-content: center; padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); background: rgb(11 22 16 / 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabbar-in { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); width: 100%; max-width: 560px; }
.tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); }
.tabbar button[aria-selected="true"] { color: var(--lima); }
.tabbar svg { width: 24px; height: 24px; }
@media (prefers-reduced-motion: no-preference) { .barra, .pista i, .barra-mes i { transition: height .35s, width .35s; } }
/* Animación de apertura: el logo rebota, la flecha se dibuja, el lima llena la pantalla y se revela el tablero */
#splash { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; overflow: hidden; transition: opacity .3s ease .45s, visibility 0s .8s; }
#splash.fuera { opacity: 0; visibility: hidden; }
.sp-logo { width: 96px; height: 96px; border-radius: 30px; background: var(--lima); display: grid; place-items: center; animation: sp-pop .7s cubic-bezier(.34, 1.56, .64, 1) backwards; transition: transform .5s cubic-bezier(.7, 0, .84, 0), border-radius .5s; }
#splash.fuera .sp-logo { transform: scale(14); border-radius: 50%; }
.sp-logo svg { width: 54px; height: 54px; fill: none; stroke: var(--lima-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.sp-l1 { stroke-dasharray: 30; stroke-dashoffset: 30; animation: sp-trazo .5s .35s ease-out forwards; }
.sp-l2 { stroke-dasharray: 12; stroke-dashoffset: 12; animation: sp-trazo .28s .78s ease-out forwards; }
.entra > * { animation: sp-sube .55s cubic-bezier(.2, .8, .2, 1) backwards; }
.entra > :nth-child(2) { animation-delay: .06s; } .entra > :nth-child(3) { animation-delay: .12s; }
.entra > :nth-child(4) { animation-delay: .18s; } .entra > :nth-child(5) { animation-delay: .24s; }
.entra > :nth-child(n+6) { animation-delay: .3s; }
@keyframes sp-pop { from { transform: scale(.3) rotate(-14deg); opacity: 0; } }
@keyframes sp-trazo { to { stroke-dashoffset: 0; } }
@keyframes sp-sube { from { transform: translateY(18px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sp-logo, .sp-l1, .sp-l2, .entra > * { animation: none; }
  .sp-l1, .sp-l2 { stroke-dashoffset: 0; }
  #splash.fuera .sp-logo { transform: none; }
}
</style>

<script id="analisis">
// Análisis puro (sin DOM). Lo prueba test/test.js.
var EXCLUIDAS = ['Pago de tarjeta', 'Transferencias', 'Ingreso'];

function esGasto(m) { return m.monto > 0 && EXCLUIDAS.indexOf(m.categoria) < 0; }
function mesDe(f) { return String(f).slice(0, 7); }
function sumarMes(ym, n) {
  var a = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n;
  a += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return a + '-' + ('0' + (m + 1)).slice(-2);
}
function diasDelMes(ym) { return new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(); }
function suma(xs, f) { return xs.reduce(function (s, x) { return s + (f ? f(x) : x); }, 0); }
function redondear(n) { return Math.round(n * 100) / 100; }
function claveComercio(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s*-?\s*parcela\s*\d+\s*\/\s*\d+/i, '').replace(/[*#].*$/, '').replace(/\s+/g, ' ').trim();
}
function nombreComercio(s) {
  return String(s || '').replace(/\s*-?\s*parcela\s*\d+\s*\/\s*\d+/i, '').replace(/\*/g, ' ').replace(/\s+/g, ' ').trim();
}
function agrupar(xs, clave, nombre) {
  var g = {};
  xs.forEach(function (x) {
    var k = clave(x);
    if (!g[k]) g[k] = { nombre: nombre(x), total: 0, n: 0 };
    g[k].total += x.monto; g[k].n++;
  });
  return Object.keys(g).map(function (k) { g[k].total = redondear(g[k].total); return g[k]; });
}
// Promedio ponderado: el mes más reciente pesa más.
function ponderado(vals) {
  if (!vals.length) return 0;
  var w = 0, s = 0;
  vals.forEach(function (v, i) { s += v * (i + 1); w += i + 1; });
  return s / w;
}
function desvio(vals) {
  if (vals.length < 2) return 0;
  var p = suma(vals) / vals.length;
  return Math.sqrt(suma(vals, function (v) { return (v - p) * (v - p); }) / (vals.length - 1));
}

/** periodo: 'mes' | '3m' | '12m' | 'todo' — afecta los rankings. */
function analizar(movs, cfg, hoy, periodo) {
  cfg = cfg || {};
  periodo = periodo || '3m';
  var gastos = movs.filter(esGasto);
  var mesActual = mesDe(hoy);
  var dia = +String(hoy).slice(8, 10);

  // Gasto por mes, sin huecos
  var primero = gastos.reduce(function (min, m) { return mesDe(m.fecha) < min ? mesDe(m.fecha) : min; }, mesActual);
  var porMes = {};
  for (var ym = primero; ym <= mesActual; ym = sumarMes(ym, 1)) porMes[ym] = { mes: ym, total: 0, credito: 0, n: 0 };
  gastos.forEach(function (m) {
    var x = porMes[mesDe(m.fecha)];
    if (!x) return;
    x.total += m.monto; x.n++;
    if (m.metodo === 'credito') x.credito += m.monto;
  });
  var meses = Object.keys(porMes).sort().map(function (k) {
    porMes[k].total = redondear(porMes[k].total); porMes[k].credito = redondear(porMes[k].credito); return porMes[k];
  });
  var completos = meses.filter(function (m) { return m.mes < mesActual; });
  var conDatos = completos.filter(function (m) { return m.n > 0; });
  var ultimos6 = conDatos.slice(-6);
  var promedio = ultimos6.length ? suma(ultimos6, function (m) { return m.total; }) / ultimos6.length : 0;
  var mesMayor = (conDatos.length ? conDatos : meses).reduce(function (a, b) { return b.total > a.total ? b : a; }, { total: -1 });
  if (mesMayor.total < 0) mesMayor = null;

  // Mes en curso: lo gastado + lo que normalmente gastas en los días que faltan
  var actual = porMes[mesActual];
  var dias = diasDelMes(mesActual);
  var proyeccion = promedio ? actual.total + promedio * (1 - dia / dias) : (dia ? actual.total / dia * dias : actual.total);
  actual = { mes: mesActual, total: actual.total, credito: actual.credito, n: actual.n, dia: dia, dias: dias, proyeccion: redondear(Math.max(proyeccion, actual.total)), promedio: redondear(promedio) };

  // Rango de meses para rankings
  var desde = { mes: mesActual, '3m': sumarMes(mesActual, -2), '12m': sumarMes(mesActual, -11), todo: '0000-00' }[periodo];
  var enPeriodo = gastos.filter(function (m) { return mesDe(m.fecha) >= desde; });
  var totalPeriodo = suma(enPeriodo, function (m) { return m.monto; });

  var topCategorias = agrupar(enPeriodo, function (m) { return m.categoria || 'Otros'; }, function (m) { return m.categoria || 'Otros'; })
    .sort(function (a, b) { return b.total - a.total; });
  topCategorias.forEach(function (c) { c.pct = totalPeriodo ? c.total / totalPeriodo : 0; });
  var comercios = agrupar(enPeriodo, function (m) { return claveComercio(m.comercio); }, function (m) { return nombreComercio(m.comercio); });
  var topComercios = comercios.slice().sort(function (a, b) { return b.total - a.total; }).slice(0, 8);
  var frecuentes = comercios.slice().sort(function (a, b) { return b.n - a.n || b.total - a.total; }).slice(0, 8);

  var porDiaSemana = [0, 0, 0, 0, 0, 0, 0]; // lunes..domingo
  var porHora = []; for (var h = 0; h < 24; h++) porHora.push(0);
  var conHora = 0;
  enPeriodo.forEach(function (m) {
    var d = new Date(m.fecha + 'T12:00:00Z').getUTCDay();
    porDiaSemana[(d + 6) % 7] += m.monto;
    if (m.hora) { porHora[+m.hora.slice(0, 2)] += m.monto; conHora++; }
  });
  var hormiga = enPeriodo.filter(function (m) { return m.monto < 50; });

  // Pronóstico del próximo mes (promedio ponderado de los últimos 3 meses con datos)
  var base = conDatos.slice(-3);
  var totalPron = ponderado(base.map(function (m) { return m.total; }));
  var var6 = desvio(ultimos6.map(function (m) { return m.total; }));
  var mesesBase = {}; base.forEach(function (m) { mesesBase[m.mes] = true; });
  var catMes = {};
  gastos.forEach(function (m) {
    if (!mesesBase[mesDe(m.fecha)]) return;
    var c = m.categoria || 'Otros';
    catMes[c] = catMes[c] || {};
    catMes[c][mesDe(m.fecha)] = (catMes[c][mesDe(m.fecha)] || 0) + m.monto;
  });
  var porCategoria = Object.keys(catMes).map(function (c) {
    return { nombre: c, total: redondear(ponderado(base.map(function (b) { return catMes[c][b.mes] || 0; }))) };
  }).sort(function (a, b) { return b.total - a.total; });

  // Cuotas (parcelas) que ya están comprometidas para los próximos meses
  var compras = {};
  movs.forEach(function (m) {
    var p = String(m.parcela || '').match(/^(\d+)\/(\d+)$/);
    if (!p || !(m.monto > 0)) return;
    var k = claveComercio(m.comercio) + '|' + p[2] + '|' + m.monto.toFixed(2);
    if (!compras[k] || +p[1] > compras[k].k) compras[k] = { k: +p[1], n: +p[2], mes: mesDe(m.fecha), monto: m.monto, nombre: nombreComercio(m.comercio) };
  });
  var cuotasMes = {}, activas = [];
  Object.keys(compras).forEach(function (k) {
    var c = compras[k], quedan = 0;
    for (var i = 1; i <= c.n - c.k; i++) {
      var mes = sumarMes(c.mes, i);
      if (mes <= mesActual) continue;
      cuotasMes[mes] = (cuotasMes[mes] || 0) + c.monto; quedan++;
    }
    if (quedan) activas.push({ nombre: c.nombre, monto: c.monto, quedan: quedan, de: c.n });
  });
  var cuotas = {
    porMes: Object.keys(cuotasMes).sort().map(function (m) { return { mes: m, total: redondear(cuotasMes[m]) }; }),
    activas: activas.sort(function (a, b) { return b.monto - a.monto; })
  };
  cuotas.pendiente = redondear(suma(cuotas.porMes, function (x) { return x.total; }));

  var pronostico = {
    mes: sumarMes(mesActual, 1),
    total: redondear(totalPron),
    min: redondear(Math.max(0, totalPron - var6)),
    max: redondear(totalPron + var6),
    porCategoria: porCategoria,
    cuotas: cuotas.porMes.length && cuotas.porMes[0].mes === sumarMes(mesActual, 1) ? cuotas.porMes[0].total : 0,
    base: base.length
  };

  return {
    meses: meses, actual: actual, mesMayor: mesMayor, promedio: redondear(promedio),
    periodo: periodo, totalPeriodo: redondear(totalPeriodo), nPeriodo: enPeriodo.length,
    topCategorias: topCategorias, topComercios: topComercios, frecuentes: frecuentes,
    porDiaSemana: porDiaSemana.map(redondear), porHora: porHora.map(redondear), conHora: conHora,
    hormiga: { n: hormiga.length, total: redondear(suma(hormiga, function (m) { return m.monto; })) },
    pronostico: pronostico, cuotas: cuotas,
    credito: evaluarCredito(gastos, meses, completos, cuotas, cfg, mesActual, movs)
  };
}

/** Evaluación simple de la actitud con el crédito: puntaje 0–100 + hallazgos en lenguaje claro. */
function evaluarCredito(gastos, meses, completos, cuotas, cfg, mesActual, movs) {
  var ultimos = completos.filter(function (m) { return m.n > 0; }).slice(-3);
  var desde = ultimos.length ? ultimos[0].mes : mesActual;
  var gastoTot = suma(ultimos, function (m) { return m.total; });
  var credTot = suma(ultimos, function (m) { return m.credito; });
  var credMensual = ultimos.length ? credTot / ultimos.length : 0;
  var parte = gastoTot ? credTot / gastoTot : 0;
  var ingreso = parseFloat(String(cfg.ingreso_mensual || '').replace(',', '.')) || 0;
  var tope = parseFloat(String(cfg.tope_tarjeta_mes || '').replace(',', '.')) || 0;
  var reciente = gastos.filter(function (m) { return mesDe(m.fecha) >= desde; });
  var intereses = reciente.filter(function (m) { return m.categoria === 'Préstamos e intereses'; });
  var totInt = suma(intereses, function (m) { return m.monto; });
  var proxCuotas = cuotas.porMes.length ? cuotas.porMes[0].total : 0;
  var credConHora = reciente.filter(function (m) { return m.metodo === 'credito' && m.hora; });
  var nocturnas = credConHora.filter(function (m) { var h = +m.hora.slice(0, 2); return h >= 22 || h < 5; });
  var actual = meses[meses.length - 1];
  var tendencia = ultimos.length >= 3 ? (ultimos[2].credito - (ultimos[0].credito + ultimos[1].credito) / 2) / Math.max(1, (ultimos[0].credito + ultimos[1].credito) / 2) : 0;

  var puntaje = 100, h = [];
  function add(nivel, titulo, texto, resta) { h.push({ nivel: nivel, titulo: titulo, texto: texto }); puntaje -= resta || 0; }
  var R = function (n) { return 'R$ ' + Math.round(n).toLocaleString('pt-BR'); };

  if (totInt > 0) add('riesgo', 'Estás pagando intereses o préstamos',
    'En los últimos meses salieron ' + R(totInt) + ' en préstamos, intereses, IOF o multas. Es la plata más cara que existe: prioriza terminar de pagarlo antes de nuevas compras en cuotas.', 30);
  else add('bien', 'Sin intereses ni préstamos', 'No aparece ningún pago de intereses, rotativo o préstamo. Sigue pagando la factura completa.', 0);

  if (ingreso) {
    var r = credMensual / ingreso;
    if (r > 0.4) add('riesgo', 'La tarjeta se lleva ' + Math.round(r * 100) + '% de tu ingreso', 'Gastas en promedio ' + R(credMensual) + ' al mes con crédito. Con más de 40% del ingreso, cualquier imprevisto termina en el rotativo.', 20);
    else if (r > 0.25) add('atento', 'La tarjeta usa ' + Math.round(r * 100) + '% de tu ingreso', 'Promedio de ' + R(credMensual) + '/mes con crédito. Lo sano es quedarse por debajo de 25–30%.', 10);
    else add('bien', 'Crédito bajo control', 'Usas ' + Math.round(r * 100) + '% de tu ingreso en la tarjeta (' + R(credMensual) + '/mes).', 0);
  } else {
    add('atento', 'Falta tu ingreso mensual', 'Cárgalo en Ajustes para saber qué parte de tu sueldo se va en la tarjeta.', 0);
  }

  if (proxCuotas > 0) {
    var rc = ingreso ? proxCuotas / ingreso : 0;
    var nivel = (rc > 0.15 || cuotas.activas.length >= 5) ? 'riesgo' : (rc > 0.08 || cuotas.activas.length >= 3 ? 'atento' : 'bien');
    add(nivel, cuotas.activas.length + ' compra' + (cuotas.activas.length === 1 ? '' : 's') + ' en cuotas activas',
      'El mes que viene ya debes ' + R(proxCuotas) + ' en parcelas, antes de comprar nada. Total pendiente: ' + R(cuotas.pendiente) + '.',
      nivel === 'riesgo' ? 15 : nivel === 'atento' ? 8 : 0);
  }

  if (tope && actual) {
    if (actual.credito > tope) add('riesgo', 'Pasaste tu tope de tarjeta este mes', 'Llevas ' + R(actual.credito) + ' con crédito y tu tope es ' + R(tope) + '. Lo que sigue va a la factura del mes que viene.', 10);
    else add(actual.credito > tope * 0.8 ? 'atento' : 'bien', 'Tope de tarjeta: ' + R(actual.credito) + ' de ' + R(tope), 'Te quedan ' + R(tope - actual.credito) + ' este mes.', 0);
  }

  if (tendencia > 0.15) add('atento', 'El uso de la tarjeta viene subiendo', 'El último mes usaste ' + Math.round(tendencia * 100) + '% más crédito que en los dos anteriores.', 10);
  else if (tendencia < -0.15) add('bien', 'El uso de la tarjeta viene bajando', 'El último mes usaste ' + Math.round(-tendencia * 100) + '% menos crédito que antes. Buen camino.', 0);

  if (parte > 0.85) add('atento', 'Casi todo pasa por la tarjeta', Math.round(parte * 100) + '% de lo que gastas es con crédito. No es malo si pagas la factura completa, pero hace más fácil perder la cuenta.', 5);

  if (credConHora.length >= 10 && nocturnas.length / credConHora.length > 0.1) {
    add('atento', 'Compras de madrugada', Math.round(nocturnas.length / credConHora.length * 100) + '% de tus compras con tarjeta son entre las 22 h y las 5 h (' + R(suma(nocturnas, function (m) { return m.monto; })) + '). Suelen ser compras por impulso, como el delivery.', 5);
  }

  var hormiga = reciente.filter(function (m) { return m.monto < 50; });
  var totRec = suma(reciente, function (m) { return m.monto; });
  if (totRec && suma(hormiga, function (m) { return m.monto; }) / totRec > 0.12) {
    add('atento', 'Gastos hormiga', hormiga.length + ' compras chicas (menos de R$ 50) suman ' + R(suma(hormiga, function (m) { return m.monto; })) + ' en el período. Juntas pesan.', 5);
  }

  puntaje = Math.max(0, Math.min(100, puntaje));
  var orden = { riesgo: 0, atento: 1, bien: 2 };
  h.sort(function (a, b) { return orden[a.nivel] - orden[b.nivel]; });
  return {
    puntaje: puntaje,
    nivel: puntaje >= 75 ? 'bien' : puntaje >= 50 ? 'atento' : 'riesgo',
    etiqueta: puntaje >= 75 ? 'Sano' : puntaje >= 50 ? 'Atento' : 'En riesgo',
    parteCredito: parte, creditoMensual: redondear(credMensual), proxCuotas: proxCuotas, intereses: redondear(totInt),
    hallazgos: h
  };
}

/** Datos de ejemplo (inventados) para ver el tablero sin conectar nada. */
function datosDemo(hoy) {
  var semilla = 7;
  function rnd() { semilla = (semilla * 16807) % 2147483647; return (semilla - 1) / 2147483646; }
  function entre(a, b) { return a + rnd() * (b - a); }
  function elegir(xs) { return xs[Math.floor(rnd() * xs.length)]; }

  }

    var limite = ym === mesActual ? diaHoy : diasDelMes(ym);
    if (d > limite) return;

      categoria: categoria, cuenta: cuenta, metodo: metodo, origen: h ? 'ApplePay' : 'CSV', parcela: parcela || '', nota: '' });

      add(ym, 3 + k, s[0], s[1], 'Suscripciones y apps', 'Nubank', 'credito');
    });
    var nSuper = Math.floor(entre(8, 12));
    for (var k = 0; k < nSuper; k++) add(ym, Math.ceil(entre(1, D)), elegir(['Supermercados Zona Sul', 'Prezunic', 'Hortifruti', 'Pão de Açúcar']), entre(45, 360) * extra, 'Supermercado', 'Nubank', 'credito', hora('dia'));
    var nFood = Math.floor(entre(6, 14) * extra);
    for (k = 0; k < nFood; k++) add(ym, Math.ceil(entre(1, D)), elegir(['iFood', 'iFood', 'Rappi', 'Padaria Flamengo', 'Bar do Adonis']), entre(28, 110), 'Restaurantes y delivery', 'Nubank', 'credito', hora('noche'));
    var nUber = Math.floor(entre(8, 18));
    for (k = 0; k < nUber; k++) add(ym, Math.ceil(entre(1, D)), elegir(['Uber *Trip', '99 Pop']), entre(11, 46), 'Transporte', elegir(['Nubank', 'Itaú']), 'credito', hora());
    for (k = 0; k < 2; k++) add(ym, Math.ceil(entre(1, D)), elegir(['Drogaria Pacheco', 'Droga Raia']), entre(25, 140), 'Salud y farmacia', 'Itaú', 'debito', hora('dia'));
    add(ym, Math.ceil(entre(1, D)), 'Pix enviado - Amigo', entre(150, 600), 'Personas (Pix)', 'Nubank', 'pix');
    if (i === -3) { add(ym, 14, 'LATAM Airlines', 1290, 'Viajes', 'Nubank', 'credito', '23:41'); add(ym, 18, 'Airbnb', 980, 'Viajes', 'Nubank', 'credito', '22:10'); }
    if (i >= -2 && i <= 0) add(ym, 8, 'Renner - Parcela ' + (i + 3) + '/4', 191.92, 'Ropa y compras', 'Nubank', 'credito', '', (i + 3) + '/4');
    if (i >= -1) add(ym, 9, 'Casa Video - Parcela ' + (i + 2) + '/6', 228.16, 'Casa y servicios', 'Itaú', 'credito', '', (i + 2) + '/6');
    if (i >= -1) add(ym, 25, 'Empréstimo Nubank - Parcela ' + (i + 2) + '/4', 944.92, 'Préstamos e intereses', 'Nubank', 'debito', '', (i + 2) + '/4');
    add(ym, 7, 'Pagamento de fatura', entre(1500, 2600), 'Pago de tarjeta', 'Itaú', 'transferencia');
    add(ym, 2, 'Câmbio recebido - Inter PJ', -14500, 'Ingreso', 'Inter PJ', 'transferencia');

function quitarSplash() {
  if (splashFuera) return;

  if (!sp) return;
  setTimeout(function () {
    var v = $('#vista');
    sp.classList.add('fuera');

// El monto del mes cuenta desde 0
function contarMonto() {
  var el = document.querySelector('.hero-monto[data-valor]');
  if (!el) return;
  var fin = +el.dataset.valor, t0 = null, dur = 900;
  function paso(t) {
    t0 = t0 || t;
    var x = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - x, 3);
    el.innerHTML = montoGrande(fin * e);
    if (x < 1) requestAnimationFrame(paso);
  }
  el.innerHTML = montoGrande(0);
  setTimeout(function () { requestAnimationFrame(paso); }, 250);
}

        : conectado === 'web' ? '<p style="margin:0">Este teléfono está conectado a tu Google Sheet (' + S.movs.length + ' movimientos).</p><div class="acciones"><button class="btn" data-accion="desconectar">Desconectar este teléfono</button></div>'
        : '<p style="margin:0" class="muted">Estás viendo datos de ejemplo. Conecta tu Google Sheet:</p>' +
          '<div class="form"><label class="campo">Dirección de tu app (termina en /exec)<input id="cx-api" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>' +
          '<label class="campo">Clave<input id="cx-k" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="La de la pestaña Config del Sheet"></label>' +
          '<div class="acciones"><button class="btn prim" data-accion="conectar">Conectar</button></div></div>') +
    '</section>' +
    '<section class="card"><h2>De dónde salen tus datos</h2><ul class="small" style="margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2)">' +
      '<li><b>Apple Pay:</b> automático. El Atajo "Transacción" manda cada compra con comercio, monto, tarjeta, día y hora.</li>' +
      '<li><b>Pix, compras online y débito sin Apple Pay:</b> importa una vez al mes el extracto de Nubank o Itaú (CSV u OFX). Lo repetido se junta solo.</li>' +
      '<li><b>Efectivo o Pix rápido:</b> el Atajo "Gasto rápido" (3 toques).</li></ul></section>';
}

// ---------------------------------------------------------------- Diálogos
function abrirMov(id) {
  var m = S.movs.filter(function (x) { return x.id === id; })[0];
  if (!m) return;
  $('#dlg-form').innerHTML = '<h2>' + esc(m.comercio) + '</h2>' +
    '<p class="small muted" style="margin:0">' + esc(m.fecha) + (m.hora ? ' · ' + esc(m.hora) : '') + ' · ' + R(m.monto) + ' · ' + esc(m.cuenta) + ' · ' + esc(METODOS[m.metodo] || m.metodo) + '<br>Origen: ' + esc(m.origen) + (m.nota ? ' · ' + esc(m.nota) : '') + '</p>' +
    '<label class="campo">Categoría<select id="ed-cat">' + S.categorias.map(function (c) { return '<option' + (c === m.categoria ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label>' +
    '<label class="campo">Método<select id="ed-met">' + Object.keys(METODOS).map(function (k) { return '<option value="' + k + '"' + (k === m.metodo ? ' selected' : '') + '>' + METODOS[k] + '</option>'; }).join('') + '</select></label>' +
    '<label class="check"><input type="checkbox" id="ed-rec" checked> Usar esta categoría siempre para este comercio</label>' +
    '<div class="acciones"><button class="btn prim" value="guardar" type="button" data-accion="guardar-mov" data-id="' + esc(id) + '">Guardar</button><button class="btn" value="cancel">Cerrar</button><button class="btn peligro" type="button" data-accion="borrar-mov" data-id="' + esc(id) + '">Borrar</button></div>';
  $('#dlg').showModal();
}
function abrirAgregar() {
  $('#dlg-form').innerHTML = '<h2>Agregar gasto</h2>' +
    '<label class="campo">Monto (R$)<input id="ag-monto" inputmode="decimal" placeholder="25,90" required></label>' +
    '<label class="campo">Dónde / qué<input id="ag-com" placeholder="Padaria, Pix a Jonas…"></label>' +
    '<label class="campo">Cuenta<select id="ag-cta">' + CUENTAS.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></label>' +
    '<label class="campo">Método<select id="ag-met">' + Object.keys(METODOS).map(function (k) { return '<option value="' + k + '"' + (k === 'pix' ? ' selected' : '') + '>' + METODOS[k] + '</option>'; }).join('') + '</select></label>' +
    '<label class="campo">Fecha<input id="ag-fecha" type="date" value="' + hoy + '"></label>' +
    '<div class="acciones"><button class="btn prim" type="button" data-accion="guardar-nuevo">Agregar</button><button class="btn" value="cancel">Cancelar</button></div>';
  $('#dlg').showModal();
}
function aviso(t) {
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  document.body.appendChild(el); setTimeout(function () { el.remove(); }, 3500);
}

function guardarMov(id) {
  var m = S.movs.filter(function (x) { return x.id === id; })[0];
  var cambios = { categoria: $('#ed-cat').value, metodo: $('#ed-met').value };
  var recordar = $('#ed-rec').checked;
  $('#dlg').close();
  var aplicar = function () {
    var clave = claveComercio(m.comercio);
    S.movs.forEach(function (x) {
      if (x.id === id) { x.categoria = cambios.categoria; x.metodo = cambios.metodo; }
      else if (recordar && claveComercio(x.comercio) === clave) x.categoria = cambios.categoria;
    });
    render();
  };
  if (S.demo) { aplicar(); aviso('Cambiado (solo en el ejemplo)'); return; }
  llamar('api_actualizar', id, cambios, recordar).then(function (r) { aplicar(); aviso(r.cambiados > 1 ? 'Listo: ' + r.cambiados + ' movimientos actualizados' : 'Guardado'); })
    .catch(function (e) { aviso('No se guardó: ' + e.message); });
}
function borrarMov(id) {
  var b = document.querySelector('[data-accion="borrar-mov"]');
  if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = 'Toca de nuevo para borrar'; return; }
  $('#dlg').close();
  var quitar = function () { S.movs = S.movs.filter(function (x) { return x.id !== id; }); render(); aviso('Borrado'); };
  if (S.demo) return quitar();
  llamar('api_borrar', id).then(quitar).catch(function (e) { aviso('No se borró: ' + e.message); });
}
function guardarNuevo() {
  var datos = { monto: $('#ag-monto').value, comercio: $('#ag-com').value, cuenta: $('#ag-cta').value, metodo: $('#ag-met').value, fecha: $('#ag-fecha').value, origen: 'Manual' };
  if (!(parseFloat(String(datos.monto).replace(/\./g, '').replace(',', '.')) > 0)) { aviso('Escribe un monto'); return; }
  $('#dlg').close();
  if (S.demo) {
    var n = parseFloat(String(datos.monto).replace(/\./g, '').replace(',', '.'));
    S.movs.unshift({ id: 'n' + Date.now(), fecha: datos.fecha, hora: '', comercio: datos.comercio || 'Sin nombre', monto: n, categoria: 'Otros', cuenta: datos.cuenta, metodo: datos.metodo, origen: 'Manual', parcela: '', nota: '' });
    render(); aviso('Agregado (solo en el ejemplo)'); return;
  }
  llamar('api_agregar', datos).then(function (m) { S.movs.unshift(m); render(); aviso('Agregado en ' + m.categoria); })
    .catch(function (e) { aviso('No se agregó: ' + e.message); });
}
function importar(file) {
  if (S.demo) { aviso('Importar funciona cuando abres tu tablero conectado'); return; }
  var leer = function (enc) {
    return new Promise(function (ok) { var fr = new FileReader(); fr.onload = function () { ok(fr.result); }; fr.readAsText(file, enc); });
  };
  aviso('Importando ' + file.name + '…');
  leer('utf-8').then(function (t) { return t.indexOf('\uFFFD') > -1 ? leer('iso-8859-1') : t; })
    .then(function (t) { return llamar('api_importar', file.name, t); })
    .then(function (r) { aviso(r.formato + ': ' + r.nuevos + ' nuevos, ' + r.conciliados + ' unidos con Apple Pay, ' + r.repetidos + ' ya estaban'); cargar(); })
    .catch(function (e) { aviso('No pude importar: ' + e.message); });
}

// ---------------------------------------------------------------- Eventos
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab],[data-ir],[data-mov],[data-periodo],[data-accion]');
  if (!t) return;
  if (t.dataset.tab || t.dataset.ir) { S.tab = t.dataset.tab || t.dataset.ir; render(); scrollTo(0, 0); }
  else if (t.dataset.mov) abrirMov(t.dataset.mov);
  else if (t.dataset.periodo) { S.periodo = t.dataset.periodo; render(); }
  else ({
    agregar: abrirAgregar, importar: function () { $('#archivo').click(); },
    'guardar-mov': function () { guardarMov(t.dataset.id); }, 'borrar-mov': function () { borrarMov(t.dataset.id); },
    'guardar-nuevo': guardarNuevo,
    reintentar: cargar, conectar: conectar, desconectar: desconectar
  })[t.dataset.accion]();
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'busca') { S.busca = e.target.value; var pos = e.target.selectionStart; render(); var b = $('#busca'); b.focus(); b.setSelectionRange(pos, pos); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'mesFiltro') { S.mesFiltro = e.target.value; render(); }
  if (e.target.id === 'archivo' && e.target.files[0]) { importar(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'form-cfg') return;
  e.preventDefault();
  var cfg = { ingreso_mensual: $('#cfg-ingreso').value.replace(/\./g, '').replace(',', '.'), tope_tarjeta_mes: $('#cfg-tope').value.replace(/\./g, '').replace(',', '.') };
  if (S.demo) { S.cfg = cfg; aviso('Guardado (solo en el ejemplo)'); render(); return; }
  llamar('api_guardarConfig', cfg).then(function (c) { S.cfg = c; aviso('Guardado'); render(); }).catch(function (er) { aviso('No se guardó: ' + er.message); });
});
// Tooltip para barras y rankings (hover en desktop, toque en el celular)
var tip = $('#tip');
function mostrarTip(el, x, y) {
  tip.textContent = el.dataset.tip; tip.hidden = false;
  var w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px';
  tip.style.top = Math.max(8, y - 40) + 'px';
}
document.addEventListener('pointermove', function (e) {
  var el = e.target.closest && e.target.closest('[data-tip]');
  if (el) mostrarTip(el, e.clientX, e.clientY); else tip.hidden = true;
});
document.addEventListener('focusin', function (e) {
  var el = e.target.closest && e.target.closest('[data-tip]');
  if (el) { var r = el.getBoundingClientRect(); mostrarTip(el, r.left + r.width / 2, r.top); } else tip.hidden = true;
});
document.addEventListener('scroll', function () { tip.hidden = true; }, { passive: true });

cargar();
</script>

</body>
</html>
